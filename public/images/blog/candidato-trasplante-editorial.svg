<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Evaluación para Candidatura a Trasplante Pulmonar - CETRA</title>
  <desc id="desc">Matriz técnica de evaluación diagnóstica con parámetros de función respiratoria, espirometría y criterios clínicos de elegibilidad.</desc>
  <defs>
    <linearGradient id="darkBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#09090B"/>
      <stop offset="60%" stop-color="#120726"/>
      <stop offset="100%" stop-color="#1e0b38"/>
    </linearGradient>
    <radialGradient id="radialAccent" cx="30%" cy="45%" r="50%">
      <stop offset="0%" stop-color="#7C3AED" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#09090B" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cyanLine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7C3AED"/>
      <stop offset="100%" stop-color="#c4b5fd"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1600" height="900" fill="url(#darkBg)"/>
  <rect width="1600" height="900" fill="url(#radialAccent)"/>

  <!-- Precision Medical Grid -->
  <g stroke="#f8f7ff" stroke-opacity="0.05" stroke-width="1">
    <line x1="120" y1="0" x2="120" y2="900"/>
    <line x1="360" y1="0" x2="360" y2="900"/>
    <line x1="600" y1="0" x2="600" y2="900"/>
    <line x1="840" y1="0" x2="840" y2="900"/>
    <line x1="1080" y1="0" x2="1080" y2="900"/>
    <line x1="1320" y1="0" x2="1320" y2="900"/>

    <line x1="0" y1="160" x2="1600" y2="160"/>
    <line x1="0" y1="360" x2="1600" y2="360"/>
    <line x1="0" y1="560" x2="1600" y2="560"/>
    <line x1="0" y1="760" x2="1600" y2="760"/>
  </g>

  <!-- Central Technical Graphic: Spirometry & Functional Curve Blueprint -->
  <g transform="translate(180, 190)">
    <!-- Diagnostic Axis -->
    <line x1="60" y1="40" x2="60" y2="380" stroke="#f8f7ff" stroke-opacity="0.2" stroke-width="1.5"/>
    <line x1="60" y1="380" x2="520" y2="380" stroke="#f8f7ff" stroke-opacity="0.2" stroke-width="1.5"/>

    <!-- Spirometry Flow-Volume Loops (Precision Curves) -->
    <!-- Healthy standard reference (dotted) -->
    <path d="M 60,380 C 100,120 280,100 480,380" fill="none" stroke="#f8f7ff" stroke-width="1.5" stroke-dasharray="5 5" stroke-opacity="0.3"/>
    
    <!-- Advanced diagnostic curve (gradient line) -->
    <path d="M 60,380 C 120,200 240,180 340,310 C 370,350 400,375 420,380" fill="none" stroke="url(#cyanLine)" stroke-width="3.5" stroke-linecap="round"/>

    <!-- Coordinates Markers -->
    <circle cx="120" cy="200" r="5" fill="#7C3AED"/>
    <circle cx="120" cy="200" r="12" fill="none" stroke="#c4b5fd" stroke-width="1" stroke-opacity="0.7"/>
    <text x="140" y="205" fill="#c4b5fd" font-family="'DM Sans', system-ui, sans-serif" font-size="11" letter-spacing="1">PEF / FLUJO PICO</text>

    <circle cx="340" cy="310" r="4" fill="#FFFFFF"/>
    <text x="355" y="315" fill="#FFFFFF" font-family="'DM Sans', system-ui, sans-serif" font-size="11" letter-spacing="1">FEV1 / 25-75%</text>

    <!-- Branching Bronchial Axis Anchor (Geometric tree node) -->
    <g transform="translate(420, 100)" stroke="#c4b5fd" fill="none">
      <path d="M 0,0 L 40,40 M 0,0 L 40,-40" stroke-width="2"/>
      <path d="M 40,40 L 70,55 M 40,40 L 70,25" stroke-width="1.5"/>
      <path d="M 40,-40 L 70,-25 M 40,-40 L 70,-55" stroke-width="1.5"/>
      <circle cx="0" cy="0" r="4" fill="#7C3AED" stroke="none"/>
      <circle cx="70" cy="55" r="3" fill="#FFFFFF" stroke="none"/>
      <circle cx="70" cy="25" r="3" fill="#FFFFFF" stroke="none"/>
      <circle cx="70" cy="-25" r="3" fill="#FFFFFF" stroke="none"/>
      <circle cx="70" cy="-55" r="3" fill="#FFFFFF" stroke="none"/>
    </g>
  </g>

  <!-- Right Panel: Clinical Assessment Cards -->
  <g transform="translate(860, 200)">
    <!-- Card 1 -->
    <g transform="translate(0, 0)">
      <rect width="560" height="95" rx="14" fill="#120726" fill-opacity="0.8" stroke="#311B92" stroke-width="1.5"/>
      <rect x="0" y="0" width="6" height="95" rx="3" fill="#7C3AED"/>
      <text x="32" y="38" fill="#c4b5fd" font-family="'DM Sans', system-ui, sans-serif" font-size="11" font-weight="700" letter-spacing="2">01 · EJE RESPIRATORIO</text>
      <text x="32" y="68" fill="#FFFFFF" font-family="'DM Sans', system-ui, sans-serif" font-size="18" font-weight="600">Pletismografía, DLCO y Espirometría Avanzada</text>
    </g>

    <!-- Card 2 -->
    <g transform="translate(0, 120)">
      <rect width="560" height="95" rx="14" fill="#120726" fill-opacity="0.8" stroke="#311B92" stroke-width="1.5"/>
      <rect x="0" y="0" width="6" height="95" rx="3" fill="#7C3AED"/>
      <text x="32" y="38" fill="#c4b5fd" font-family="'DM Sans', system-ui, sans-serif" font-size="11" font-weight="700" letter-spacing="2">02 · EJE SISTÉMICO Y CARDIOVASCULAR</text>
      <text x="32" y="68" fill="#FFFFFF" font-family="'DM Sans', system-ui, sans-serif" font-size="18" font-weight="600">Ecocardiograma, Cateterismo y Función Renal</text>
    </g>

    <!-- Card 3 -->
    <g transform="translate(0, 240)">
      <rect width="560" height="95" rx="14" fill="#120726" fill-opacity="0.8" stroke="#311B92" stroke-width="1.5"/>
      <rect x="0" y="0" width="6" height="95" rx="3" fill="#25D366"/>
      <text x="32" y="38" fill="#c4b5fd" font-family="'DM Sans', system-ui, sans-serif" font-size="11" font-weight="700" letter-spacing="2">03 · FACTORES DE OPTIMIZACIÓN</text>
      <text x="32" y="68" fill="#FFFFFF" font-family="'DM Sans', system-ui, sans-serif" font-size="18" font-weight="600">Rehabilitación Pulmonar y Red de Cuidados</text>
    </g>
  </g>

  <!-- Editorial Typography Header & Footers -->
  <g fill="#f8f7ff" font-family="'DM Sans', system-ui, sans-serif">
    <!-- Kicker -->
    <text x="110" y="118" font-size="14" font-weight="700" letter-spacing="5" fill="#c4b5fd">
      CETRA · PROTOCOLO DE EVALUACIÓN
    </text>

    <!-- Title -->
    <text x="110" y="780" font-size="38" font-weight="300" letter-spacing="-0.5">
      Criterios de Candidatura y Tiempo de Referencia
    </text>

    <!-- Subtitle -->
    <text x="110" y="825" font-size="16" font-weight="400" fill="#c4b5fd" opacity="0.8" letter-spacing="0.5">
      La valoración oportuna determina la viabilidad quirúrgica y el pronóstico de éxito
    </text>
  </g>

  <!-- Decorative Accent Line -->
  <line x1="110" y1="735" x2="210" y2="735" stroke="#7C3AED" stroke-width="4" stroke-linecap="round"/>
</svg>