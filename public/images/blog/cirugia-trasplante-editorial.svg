<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Técnica Quirúrgica de Trasplante Pulmonar - CETRA</title>
  <desc id="desc">Esquema quirúrgico de alta precisión que ilustra la iluminación cenital, las tres anastomosis cardiotorácicas y el soporte extracorpóreo.</desc>
  <defs>
    <linearGradient id="surgBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#09090B"/>
      <stop offset="50%" stop-color="#120726"/>
      <stop offset="100%" stop-color="#05020c"/>
    </linearGradient>
    <radialGradient id="lampGlow" cx="50%" cy="18%" r="48%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.85"/>
      <stop offset="15%" stop-color="#c4b5fd" stop-opacity="0.5"/>
      <stop offset="40%" stop-color="#7C3AED" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#09090B" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="surgicalBeam" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#7C3AED" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1600" height="900" fill="url(#surgBg)"/>

  <!-- Surgical Lamp Focused Light Cone -->
  <path d="M 680,140 L 920,140 L 1150,680 L 450,680 Z" fill="url(#surgicalBeam)"/>
  <rect width="1600" height="900" fill="url(#lampGlow)"/>

  <!-- Surgical Lamp Overhead Fixture (Precision Optics) -->
  <g transform="translate(800, 140)">
    <!-- Outer rim -->
    <ellipse cx="0" cy="0" rx="140" ry="26" fill="#120726" stroke="#c4b5fd" stroke-width="2.5"/>
    <ellipse cx="0" cy="0" rx="110" ry="20" fill="none" stroke="#FFFFFF" stroke-width="1.5" stroke-opacity="0.7"/>
    <!-- LED Optical clusters -->
    <circle cx="-60" cy="0" r="10" fill="#FFFFFF" opacity="0.9"/>
    <circle cx="-20" cy="-6" r="10" fill="#FFFFFF" opacity="0.9"/>
    <circle cx="20" cy="-6" r="10" fill="#FFFFFF" opacity="0.9"/>
    <circle cx="60" cy="0" r="10" fill="#FFFFFF" opacity="0.9"/>
    <circle cx="0" cy="5" r="12" fill="#FFFFFF"/>
    <!-- Suspension Arm -->
    <line x1="0" y1="-26" x2="0" y2="-140" stroke="#7C3AED" stroke-width="4"/>
  </g>

  <!-- Central Blueprint: The 3 Surgical Connections (Vascular & Airway) -->
  <g transform="translate(800, 480)">
    <!-- Operative Field Focal Ring -->
    <ellipse cx="0" cy="0" rx="260" ry="120" fill="#120726" fill-opacity="0.7" stroke="#7C3AED" stroke-width="2" stroke-dasharray="6 4"/>

    <!-- Airway / Main Bronchus (Center-Top) -->
    <g stroke="#FFFFFF" stroke-width="3" stroke-linecap="round">
      <line x1="-30" y1="-70" x2="-30" y2="-10"/>
      <line x1="30" y1="-70" x2="30" y2="-10"/>
      <!-- Suture rings -->
      <line x1="-28" y1="-50" x2="28" y2="-50" stroke="#c4b5fd" stroke-width="1.5"/>
      <line x1="-28" y1="-30" x2="28" y2="-30" stroke="#c4b5fd" stroke-width="1.5"/>
      <!-- Anastomosis Suture Line (Micro-stitches) -->
      <line x1="-34" y1="-10" x2="34" y2="-10" stroke="#7C3AED" stroke-width="4"/>
      <circle cx="-34" cy="-10" r="3" fill="#FFFFFF"/>
      <circle cx="0" cy="-10" r="3" fill="#FFFFFF"/>
      <circle cx="34" cy="-10" r="3" fill="#FFFFFF"/>
    </g>

    <!-- Pulmonary Artery Anastomosis (Left) -->
    <g transform="translate(-130, 20)">
      <path d="M -40,-40 C -10,-20 10,-10 40,0" fill="none" stroke="#7C3AED" stroke-width="5" stroke-linecap="round"/>
      <circle cx="40" cy="0" r="6" fill="#FFFFFF" stroke="#7C3AED" stroke-width="2"/>
      <text x="-120" y="-15" fill="#c4b5fd" font-family="'DM Sans', system-ui, sans-serif" font-size="12" font-weight="600" letter-spacing="1">ARTERIA PULMONAR</text>
    </g>

    <!-- Pulmonary Veins Cuff to Left Atrium (Right) -->
    <g transform="translate(130, 20)">
      <path d="M 40,-40 C 10,-20 -10,-10 -40,0" fill="none" stroke="#c4b5fd" stroke-width="5" stroke-linecap="round"/>
      <circle cx="-40" cy="0" r="6" fill="#FFFFFF" stroke="#c4b5fd" stroke-width="2"/>
      <text x="45" y="-15" fill="#c4b5fd" font-family="'DM Sans', system-ui, sans-serif" font-size="12" font-weight="600" letter-spacing="1">VENAS PULMONARES</text>
    </g>

    <!-- Airway label -->
    <text x="-55" y="-85" fill="#FFFFFF" font-family="'DM Sans', system-ui, sans-serif" font-size="12" font-weight="600" letter-spacing="1">ANASTOMOSIS BRONQUIAL</text>
  </g>

  <!-- Extracorporeal Support (ECMO) Flow Indicator -->
  <g transform="translate(1180, 240)">
    <rect width="280" height="90" rx="12" fill="#120726" stroke="#7C3AED" stroke-width="1.5" stroke-opacity="0.8"/>
    <text x="24" y="34" fill="#c4b5fd" font-family="'DM Sans', system-ui, sans-serif" font-size="11" font-weight="700" letter-spacing="2">SOPORTE VITAL</text>
    <text x="24" y="62" fill="#FFFFFF" font-family="'DM Sans', system-ui, sans-serif" font-size="16" font-weight="600">Circulación ECMO Veno-Arterial</text>
  </g>

  <!-- Editorial Typography Header & Footers -->
  <g fill="#f8f7ff" font-family="'DM Sans', system-ui, sans-serif">
    <!-- Kicker -->
    <text x="110" y="118" font-size="14" font-weight="700" letter-spacing="5" fill="#c4b5fd">
      CETRA · PROTOCOLO QUIRÚRGICO
    </text>

    <!-- Title -->
    <text x="110" y="780" font-size="38" font-weight="300" letter-spacing="-0.5">
      La Cirugía de Trasplante Paso a Paso
    </text>

    <!-- Subtitle -->
    <text x="110" y="825" font-size="16" font-weight="400" fill="#c4b5fd" opacity="0.8" letter-spacing="0.5">
      Microcirugía de alta precisión · Preparación · Quirófano · Recuperación en UCI
    </text>
  </g>

  <!-- Decorative Accent Line -->
  <line x1="110" y1="735" x2="210" y2="735" stroke="#7C3AED" stroke-width="4" stroke-linecap="round"/>
</svg>