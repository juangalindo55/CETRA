<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Biomecánica del Diafragma y Hernia Diafragmática - CETRA</title>
  <desc id="desc">Esquema biomecánico de la cúpula diafragmática, dinámica de presiones toracoabdominales y reparación por mínima invasión.</desc>
  <defs>
    <linearGradient id="diaBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#09090B"/>
      <stop offset="45%" stop-color="#120726"/>
      <stop offset="100%" stop-color="#05020c"/>
    </linearGradient>
    <radialGradient id="diaGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#7C3AED" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#09090B" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="domeGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#311B92"/>
      <stop offset="50%" stop-color="#7C3AED"/>
      <stop offset="100%" stop-color="#c4b5fd"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1600" height="900" fill="url(#diaBg)"/>
  <rect width="1600" height="900" fill="url(#diaGlow)"/>

  <!-- Geometric Grid & Axis -->
  <g stroke="#f8f7ff" stroke-opacity="0.05" stroke-width="1">
    <line x1="200" y1="180" x2="1400" y2="180"/>
    <line x1="200" y1="460" x2="1400" y2="460" stroke-dasharray="8 6"/>
    <line x1="200" y1="720" x2="1400" y2="720"/>
    <line x1="800" y1="120" x2="800" y2="780" stroke-opacity="0.08"/>
  </g>

  <!-- Biomechanical Dome of the Diaphragm (Cúpula Muscular) -->
  <g fill="none">
    <!-- Diaphragmatic Muscle Arch (Broad smooth mechanical dome) -->
    <path d="M 320,560 C 460,320 680,280 800,290 C 920,280 1140,320 1280,560" stroke="url(#domeGrad)" stroke-width="8" stroke-linecap="round"/>
    <!-- Secondary reinforcing tendon layer -->
    <path d="M 360,570 C 480,360 680,320 800,330 C 920,320 1120,360 1240,570" stroke="#FFFFFF" stroke-width="2" stroke-opacity="0.6" stroke-linecap="round"/>

    <!-- Inspiratory Vectors: Downward piston movement creating negative intrathoracic pressure -->
    <g stroke="#c4b5fd" stroke-width="2.5" stroke-linecap="round" opacity="0.8">
      <!-- Left Vectors -->
      <line x1="580" y1="360" x2="580" y2="440"/>
      <polyline points="572,430 580,442 588,430"/>

      <!-- Center Vector (Main) -->
      <line x1="800" y1="340" x2="800" y2="460" stroke="#FFFFFF" stroke-width="3.5"/>
      <polyline points="790,446 800,464 810,446" stroke="#FFFFFF" stroke-width="3.5"/>

      <!-- Right Vectors -->
      <line x1="1020" y1="360" x2="1020" y2="440"/>
      <polyline points="1012,430 1020,442 1028,430"/>
    </g>
  </g>

  <!-- Cavity Zone Badges -->
  <!-- Thoracic Cavity (Top) -->
  <g transform="translate(800, 200)">
    <rect x="-140" y="-18" width="280" height="36" rx="18" fill="#120726" stroke="#7C3AED" stroke-width="1.5"/>
    <text x="0" y="5" text-anchor="middle" fill="#FFFFFF" font-family="'DM Sans', system-ui, sans-serif" font-size="11" font-weight="700" letter-spacing="2">CAVIDAD TORÁCICA (PRESIÓN -)</text>
  </g>

  <!-- Abdominal Cavity (Bottom) -->
  <g transform="translate(800, 620)">
    <rect x="-140" y="-18" width="280" height="36" rx="18" fill="#120726" stroke="#311B92" stroke-width="1.5"/>
    <text x="0" y="5" text-anchor="middle" fill="#c4b5fd" font-family="'DM Sans', system-ui, sans-serif" font-size="11" font-weight="700" letter-spacing="2">CAVIDAD ABDOMINAL (PRESIÓN +)</text>
  </g>

  <!-- Minimally Invasive VATS Repair Feature Box -->
  <g transform="translate(1180, 260)">
    <rect width="280" height="85" rx="12" fill="#120726" stroke="#7C3AED" stroke-width="1.5" stroke-opacity="0.8"/>
    <text x="24" y="32" fill="#c4b5fd" font-family="'DM Sans', system-ui, sans-serif" font-size="11" font-weight="700" letter-spacing="2">ABORDAJE QUIRÚRGICO</text>
    <text x="24" y="58" fill="#FFFFFF" font-family="'DM Sans', system-ui, sans-serif" font-size="15" font-weight="600">Cirugía Mínima Invasión (VATS)</text>
  </g>

  <!-- Editorial Typography Header & Footers -->
  <g fill="#f8f7ff" font-family="'DM Sans', system-ui, sans-serif">
    <!-- Kicker -->
    <text x="110" y="118" font-size="14" font-weight="700" letter-spacing="5" fill="#c4b5fd">
      CETRA · CIRUGÍA TORÁCICA AVANZADA
    </text>

    <!-- Title -->
    <text x="110" y="780" font-size="38" font-weight="300" letter-spacing="-0.5">
      Hernia Diafragmática y Biomecánica Respiratoria
    </text>

    <!-- Subtitle -->
    <text x="110" y="825" font-size="16" font-weight="400" fill="#c4b5fd" opacity="0.8" letter-spacing="0.5">
      Cúpula diafragmática · Dinámica de presiones · Reconstrucción y plicatura
    </text>
  </g>

  <!-- Decorative Accent Line -->
  <line x1="110" y1="735" x2="210" y2="735" stroke="#7C3AED" stroke-width="4" stroke-linecap="round"/>
</svg>